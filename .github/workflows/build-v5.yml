      - name: Build debug APK
        run: cd proj && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ReelCounter-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk ReelCounter.apk
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest ReelCounter.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Reel Counter latest build" --notes "Download ReelCounter.apk and tap it to install."
