              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#6C4CF1"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M38,28h32a6,6 0 0 1 6,6v40a6,6 0 0 1 -6,6h-32a6,6 0 0 1 -6,-6v-40a6,6 0 0 1 6,-6z" />
              <path
                  android:fillColor="#6C4CF1"
                  android:pathData="M48,42l16,12l-16,12z" />
          </vector>
          __END_OF_FILE__
          mkdir -p "$(dirname 'app/src/main/res/drawable/widget_bg.xml')"
          cat > 'app/src/main/res/drawable/widget_bg.xml' <<'__END_OF_FILE__'
