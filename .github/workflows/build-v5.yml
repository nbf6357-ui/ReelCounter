          mkdir -p "$(dirname 'app/src/main/res/layout/widget_counter.xml')"
          cat > 'app/src/main/res/layout/widget_counter.xml' <<'__END_OF_FILE__'
          <?xml version="1.0" encoding="utf-8"?>
