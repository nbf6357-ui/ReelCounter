          </LinearLayout>
          __END_OF_FILE__
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'__END_OF_FILE__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Reel Counter</string>
